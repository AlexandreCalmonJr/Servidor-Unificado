# deploy/nginx.conf
# Servidor Unificado MDM — Configuração Nginx com SSL/TLS e WebSocket
# ===================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Suporte a WebSocket (Upgrade de conexão)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream do backend Node.js
    upstream mdm_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Redirecionamento HTTP -> HTTPS
    server {
        listen 80;
        server_name mdm.local localhost;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS / TLS
    server {
        listen 443 ssl http2;
        server_name mdm.local localhost;

        # Certificados SSL (substitua pelos caminhos reais da sua empresa)
        ssl_certificate     /etc/ssl/certs/mdm.crt;
        ssl_certificate_key /etc/ssl/private/mdm.key;

        # Configurações modernas de SSL/TLS (Mozilla Modern/Intermediate)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Headers de Segurança
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        # Rota WebSocket
        location /ws {
            proxy_pass http://mdm_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Demais rotas da API e Frontend
        location / {
            proxy_pass http://mdm_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
