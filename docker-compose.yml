# docker-compose.yml
# Servidor MDM Unificado — Orquestração de Containers de Produção (Fase P5)

services:
  # Servidor MDM (Node.js)
  mdm-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mdm-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/mdm
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - COMMAND_SIGNING_PRIVATE_KEY_FILE=/run/secrets/command_private_key
      - COMMAND_SIGNING_PUBLIC_KEY_FILE=/run/secrets/command_public_key
    secrets:
      - command_private_key
      - command_public_key
    volumes:
      - ./logs:/usr/src/app/logs
      - ./public:/usr/src/app/public
      - backups-data:/backups
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mdm-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: mdm
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - backups-data:/backups
    networks:
      - mdm-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - mdm-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Caddy Reverse Proxy TLS (opcional com --profile proxy)
  caddy:
    image: caddy:2-alpine
    container_name: mdm-caddy
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - UPSTREAM=mdm-server:3000
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      mdm-server:
        condition: service_healthy
    networks:
      - mdm-network

# Redes isoladas
networks:
  mdm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes para persistência
volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local
  backups-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

# Segredos gerenciados (Docker Secrets)
secrets:
  command_private_key:
    file: ./secrets/command_private_key.pem
  command_public_key:
    file: ./secrets/command_public_key.pem
