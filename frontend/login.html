<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MDM Server — Painel de Administração">
    <title>MDM Server — Login</title>
    <link rel="stylesheet" href="css/panel.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-area">
                <h1>MDM<span>.</span>Server</h1>
                <p>Painel de Gerenciamento</p>
            </div>

            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="login-username">Usuário</label>
                    <input type="text" id="login-username" name="username" placeholder="seu.usuario"
                        autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••"
                        autocomplete="current-password" required>
                </div>

                <p id="login-error" class="login-error"></p>

                <button type="submit" class="btn btn-primary"
                    style="width:100%; justify-content:center; padding: 12px;">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (localStorage.getItem('mdm_token')) {
            window.location.href = '/panel/';
        }

        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('login-error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';

            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                errorEl.textContent = 'Preencha todos os campos.';
                return;
            }

            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            try {
                const data = await API.post('/auth/login', { username, password });
                if (data.token) {
                    localStorage.setItem('mdm_token', data.token);
                    if (data.user) {
                        localStorage.setItem('mdm_user', JSON.stringify(data.user));
                    }
                    window.location.href = '/panel/';
                } else {
                    errorEl.textContent = 'Resposta inválida do servidor.';
                }
            } catch (err) {
                errorEl.textContent = err.message || 'Erro ao conectar. Tente novamente.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
            }
        });
    </script>
</body>

</html>
