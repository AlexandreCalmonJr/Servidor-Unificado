<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MDM Server - Painel de Administracao">
    <title>MDM Server - Login</title>
    <link rel="stylesheet" href="css/panel.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-area">
                <h1>MDM<span>.</span>Server</h1>
                <p>Painel de Gerenciamento</p>
            </div>

            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="login-username">Usuario</label>
                    <input type="text" id="login-username" name="username" placeholder="seu.usuario"
                        autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" name="password" placeholder="********"
                        autocomplete="current-password" required>
                </div>

                <p id="login-error" class="login-error"></p>

                <button type="submit" class="btn btn-primary"
                    style="width:100%; justify-content:center; padding: 12px;">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
